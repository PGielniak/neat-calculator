services:
  data_pipeline:
    build:
      context: .
      dockerfile: docker/data_pipeline/Dockerfile
    env_file: .env
    ports:
      - "8010:80"

  model_training:
    build:
      context: .
      dockerfile: docker/model_training/Dockerfile
    env_file: .env
    ports:
      - "8011:80"

  prediction_api:
    build:
      context: .
      dockerfile: docker/prediction_api/Dockerfile
    env_file: .env
    ports:
      - "8012:80"

  api_keys:
    build:
      context: .
      dockerfile: docker/api_keys/Dockerfile
    env_file: .env
    ports:
      - "8013:80"

  mlflow:
    image: python:3.10-slim
    command:
      - bash
      - -c
      - |
        pip install mlflow==3.9.0 psycopg2-binary azure-storage-blob azure-identity && \
        mlflow server \
        --backend-store-uri postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_URL}:${DB_PORT}/${DATABASE_NAME} \
        --default-artifact-root wasbs://${AZURE_STORAGE_CONTAINER}@${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/mlflow-artifacts \
        --host 0.0.0.0 \
        --port 80 \
        --allowed-hosts '*' \
        --cors-allowed-origins '*'
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_ACCESS_KEY=${AZURE_STORAGE_ACCESS_KEY}
      - MLFLOW_PORT=80
    env_file:
      - .env
    ports:
      - "8014:80"
    restart: unless-stopped
