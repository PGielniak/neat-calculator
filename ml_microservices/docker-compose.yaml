services:
  data_pipeline:
    build:
      context: .
      dockerfile: docker/data_pipeline/Dockerfile
    env_file: .env
    ports:
      - "8010:80"
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 1G

  model_training:
    build:
      context: .
      dockerfile: docker/model_training/Dockerfile
    env_file: .env
    ports:
      - "8011:80"
    deploy:
      resources:
        reservations:
          cpus: '1.0'
          memory: 1G
        limits:
          cpus: '4.0'
          memory: 4G

  prediction_api:
    build:
      context: .
      dockerfile: docker/prediction_api/Dockerfile
    env_file: .env
    environment:
      - DRAGONFLY_URL=redis://dragonfly:6379
      - API_KEY_SERVICE_URL=http://api_keys:80/api-keys/validate
    ports:
      - "8012:80"
    depends_on:
      - dragonfly
    deploy:
      resources:
        reservations:
          cpus: '0.5'
          memory: 512M
        limits:
          cpus: '2.0'
          memory: 2G

  api_keys:
    build:
      context: .
      dockerfile: docker/api_keys/Dockerfile
    env_file: .env
    ports:
      - "8013:80"
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 128M
        limits:
          cpus: '0.5'
          memory: 256M

  mlflow:
    image: python:3.10-slim
    command:
      - bash
      - -c
      - |
        pip install mlflow==3.9.0 psycopg2-binary azure-storage-blob azure-identity && \
        mlflow server \
        --backend-store-uri postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_URL}:${DB_PORT}/${DATABASE_NAME} \
        --default-artifact-root wasbs://${AZURE_STORAGE_CONTAINER}@${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/mlflow-artifacts \
        --host 0.0.0.0 \
        --port 80 \
        --allowed-hosts '*' \
        --cors-allowed-origins '*'
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_ACCESS_KEY=${AZURE_STORAGE_ACCESS_KEY}
      - MLFLOW_PORT=80
    env_file:
      - .env
    ports:
      - "8014:80"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 1G

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - "6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 128M
        limits:
          cpus: '0.5'
          memory: 512M
