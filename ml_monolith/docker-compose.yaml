services:
  mlflow:
    image: python:3.10-slim
    command:
      - bash
      - -c
      - |
        pip install mlflow==3.9.0 psycopg2-binary azure-storage-blob azure-identity && \
        mlflow server \
        --backend-store-uri postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_URL}:${DB_PORT}/${DATABASE_NAME} \
        --default-artifact-root wasbs://${AZURE_STORAGE_CONTAINER}@${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/mlflow-artifacts \
        --host 0.0.0.0 \
        --port 5100 \
        --allowed-hosts '*' \
        --cors-allowed-origins '*'
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_ACCESS_KEY=${AZURE_STORAGE_ACCESS_KEY}
      - MLFLOW_PORT=5100
    env_file:
      - .env
    ports:
      - "5100:5100"
    restart: unless-stopped

  data-pipeline-webhook:
    build: .
    image: ml-monolith:latest
    command: uvicorn data_pipeline.webhook:app --host 0.0.0.0 --port 8000 --log-level info
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - mlflow

  model-training-webhook:
    build: .
    image: ml-monolith:latest
    command: uvicorn model_training.webhook:app --host 0.0.0.0 --port 8001 --log-level info
    env_file:
      - .env
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      - mlflow
      - data-pipeline-webhook

